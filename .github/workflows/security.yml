name: Security

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    # Mondays at 06:00 UTC — catches new advisories against unchanged deps.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks-action needs the parent commit of the first PR commit
          # to compute the diff range, so fetch full history in every event.
          fetch-depth: 0

      - name: Run gitleaks
        # TODO: pin by SHA once we've reviewed a known-good release.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependencies: high/critical advisories fail the job.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Dev dependencies: report only. A flagged dev tool shouldn't block a
      # PR, but we still want it visible in the run log so we can react.
      - name: Audit dev dependencies (informational)
        run: pnpm audit --audit-level high
        continue-on-error: true
