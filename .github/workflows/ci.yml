name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          UPSTASH_REDIS_REST_URL: http://localhost:8079
          UPSTASH_REDIS_REST_TOKEN: ci-build-token
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: auto
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: ci
          S3_PUBLIC_URL: http://localhost:9000/ci
          SESSION_SECRET: ci-build-session-secret-not-used-at-runtime-xx
          RATE_LIMIT_SALT: ci-build-rate-limit-salt-not-used-at-runtime-x
          CRON_SECRET: ci-build-cron-secret-not-used-at-runtime-xxxxxx
        run: pnpm build

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          UPSTASH_REDIS_REST_URL: http://localhost:8079
          UPSTASH_REDIS_REST_TOKEN: ci-build-token
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: auto
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: ci
          S3_PUBLIC_URL: http://localhost:9000/ci
          SESSION_SECRET: ci-build-session-secret-not-used-at-runtime-xx
          RATE_LIMIT_SALT: ci-build-rate-limit-salt-not-used-at-runtime-x
          RATE_LIMIT_ENABLED: 'false'
          CRON_SECRET: ci-build-cron-secret-not-used-at-runtime-xxxxxx
        run: |
          pnpm start &
          npx wait-on http://localhost:3000 --timeout 30000
          pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          UPSTASH_REDIS_REST_URL: http://localhost:8079
          UPSTASH_REDIS_REST_TOKEN: ci-build-token
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: auto
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: ci
          S3_PUBLIC_URL: http://localhost:9000/ci
          SESSION_SECRET: ci-build-session-secret-not-used-at-runtime-xx
          RATE_LIMIT_SALT: ci-build-rate-limit-salt-not-used-at-runtime-x
          CRON_SECRET: ci-build-cron-secret-not-used-at-runtime-xxxxxx
        run: pnpm build
