version: 2

updates:
  # npm packages — Knack's app deps.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    labels:
      - dependencies
      - javascript
    groups:
      production-deps:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-deps:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Locked to whatever version Next 16 ships with. We bump these
      # explicitly when we bump Next.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'

  # GitHub Actions — keep CI/security workflow actions current.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
