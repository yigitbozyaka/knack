services:
  postgres:
    image: postgres:16
    container_name: knack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knack
      POSTGRES_USER: knack
      POSTGRES_PASSWORD: knack
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knack -d knack']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: knack-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Serverless Redis HTTP — proxies the Upstash REST API to the real Redis
  # container. Lets dev use the same `@upstash/redis` REST client as
  # production, so we don't maintain two transport code paths.
  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: knack-redis-http
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: knack-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '8079:80'
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: knack-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
